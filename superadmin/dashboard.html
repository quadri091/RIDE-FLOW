<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <title>Super Admin - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="email-modal-overlay" id="actionModal">
      <div class="email-modal">
        <div class="email-modal-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="25px"
            viewBox="0 -960 960 960"
            width="25px"
            fill="#0a8f3c"
          >
            <path
              d="M80-120v-80h360v-447q-26-9-45-28t-28-45H240l120 280q0 50-41 85t-99 35q-58 0-99-35t-41-85l120-280h-80v-80h247q12-35 43-57.5t70-22.5q39 0 70 22.5t43 57.5h247v80h-80l120 280q0 50-41 85t-99 35q-58 0-99-35t-41-85l120-280H593q-9 26-28 45t-45 28v447h360v80H80Zm585-320h150l-75-174-75 174Zm-520 0h150l-75-174-75 174Zm335-280q17 0 28.5-11.5T520-760q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760q0 17 11.5 28.5T480-720Z"
            />
          </svg>
        </div>

        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>

        <textarea id="modalReason"></textarea>
        <input type="datetime-local" id="modalDate" />

        <div class="email-modal-buttons">
          <button class="email-cancel" onclick="closeModal()">Cancel</button>
          <button class="email-confirm" onclick="modalConfirm(this)">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <div class="drawer"></div>
    <div class="load">
      <div id="wifi-loader">
        <svg class="circle-outer" viewBox="0 0 86 86">
          <circle class="back" cx="43" cy="43" r="40"></circle>
          <circle class="front" cx="43" cy="43" r="40"></circle>
        </svg>
        <svg class="circle-middle" viewBox="0 0 60 60">
          <circle class="back" cx="30" cy="30" r="27"></circle>
          <circle class="front" cx="30" cy="30" r="27"></circle>
        </svg>
        <svg class="circle-inner" viewBox="0 0 34 34">
          <circle class="back" cx="17" cy="17" r="14"></circle>
          <circle class="front" cx="17" cy="17" r="14"></circle>
        </svg>
      </div>
    </div>
    <audio src="../notification.mp3" id="audio"></audio>
    <div class="notifys"></div>

    <div class="left">
      <div class="first">
        <div class="logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="38"
            height="38"
            viewBox="0 0 48 48"
            fill="none"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M18 9h10c6 0 10 3.5 10 8.5S34 26 28 26h-6"
              stroke="#3fd27c"
            />
            <path d="M7 29c4-4 9-4 14-1" stroke="#22b35e" />
            <path d="M18 31l-6 10" stroke="#1a9e4f" />
            <path d="M23 31l7 9 10-9" stroke="#22b35e" />
          </svg>
        </div>
        <h2>RideFlow</h2>
      </div>
      <span>SUPER ADMIN</span>

      <div class="cont">
        <div class="cont-each" onclick="sideBar(event, 0)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M516-120 402-402 120-516v-56l720-268-268 720h-56Zm26-148 162-436-436 162 196 78 78 196Zm-78-196Z"
            />
          </svg>
          <span>Overview</span>
        </div>
        <div class="cont-each" onclick="sideBar(event, 1)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm112-192 56-56-128-128v-184h-80v216l152 152ZM480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-133-93.5-226.5T480-800Z"
            />
          </svg>
          <span>Trips</span>
        </div>
        <div class="cont-each" onclick="sideBar(event, 2)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M80-120v-80h360v-447q-26-9-45-28t-28-45H240l120 280q0 50-41 85t-99 35q-58 0-99-35t-41-85l120-280h-80v-80h247q12-35 43-57.5t70-22.5q39 0 70 22.5t43 57.5h247v80h-80l120 280q0 50-41 85t-99 35q-58 0-99-35t-41-85l120-280H593q-9 26-28 45t-45 28v447h360v80H80Zm585-320h150l-75-174-75 174Zm-520 0h150l-75-174-75 174Zm335-280q17 0 28.5-11.5T520-760q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760q0 17 11.5 28.5T480-720Z"
            />
          </svg>
          <span>Disputes</span>
          <p id="disputeCount"></p>
        </div>
        <div class="cont-each" onclick="sideBar(event, 3)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z"
            />
          </svg>
          <span>Users</span>
        </div>
        <div class="cont-each" onclick="sideBar(event, 4)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M612-292 440-464v-216h80v184l148 148-56 56Zm-498-25q-13-29-21-60t-11-63h81q3 21 8.5 42t13.5 41l-71 40ZM82-520q3-32 11-63.5t22-60.5l70 40q-8 20-13.5 41t-8.5 43H82Zm165 366q-27-20-50-43.5T154-248l70-40q14 18 29.5 33.5T287-225l-40 71Zm-22-519-71-40q20-27 43-50t50-43l40 71q-17 14-32.5 29.5T225-673ZM440-82q-32-3-63.5-11T316-115l40-70q20 8 41 13.5t43 8.5v81Zm-84-693-40-70q29-14 60.5-22t63.5-11v81q-22 3-43 8.5T356-775ZM520-82v-81q22-3 43-8.5t41-13.5l40 70q-29 14-60.5 22T520-82Zm84-693q-20-8-41-13.5t-43-8.5v-81q32 3 63.5 11t60.5 22l-40 70Zm109 621-40-71q17-14 32.5-29.5T735-287l71 40q-20 27-43 50.5T713-154Zm22-519q-14-17-29.5-32.5T673-735l40-71q27 19 50 42t42 50l-70 41Zm62 153q-3-22-8.5-43T775-604l70-41q13 30 21.5 61.5T878-520h-81Zm48 204-70-40q8-20 13.5-41t8.5-43h81q-3 32-11 63.5T845-316Z"
            />
          </svg>
          <span>Suspended &amp; Banned</span>
        </div>
        <div class="cont-each" onclick="sideBar(event, 5)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M280-160q-33 0-56.5-23.5T200-240v-370L40-800h760q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H280Zm-68-560 68 80v400h520v-480H212Zm328 460 56-56-44-44h168v-80H360l180 180ZM360-520h360L540-700l-56 56 44 44H360v80Zm146 40Z"
            />
          </svg>
          <span>Messages</span>
          <p id="messageCount"></p>
        </div>
        <div class="cont-each" onclick="sideBar(event, 6)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"
            />
          </svg>
          <span>Staff</span>
          <p id="staffCount"></p>
        </div>
        <div class="cont-each" onclick="sideBar(event, 7)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="22px"
            viewBox="0 -960 960 960"
            width="22px"
          >
            <path
              d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-400h160v400H160Z"
            />
          </svg>
          <span>Reports</span>
        </div>
      </div>

      <div class="detail">
        <h5 class="namet"></h5>
        <p id="staffLine"></p>
        <button
          onclick="
            rippleEffect(event);
            logout();
          "
        >
          Log Out
        </button>
      </div>
    </div>

    <div class="shade" onclick="toggleMenu()"></div>
    <div class="right">
      <div class="head">
        <button class="menu-btn" onclick="toggleMenu()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#1f1f1f"
          >
            <path
              d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
            />
          </svg>
        </button>
        <div class="cont">
          <h1 class="name"></h1>
          <span>Here is what's happening on Ride-Flow.</span>
        </div>
        <p class="role-badge">Super Admin</p>
      </div>

      <div class="grid">
        <div class="grid-box">
          <p>Total Trips</p>
          <h2 id="totalTrips">0</h2>
        </div>
        <div class="grid-box">
          <p>Active Trips</p>
          <h2 id="activeTrips">0</h2>
        </div>
        <div class="grid-box">
          <p>Open Disputes</p>
          <h2 id="openDisputes">0</h2>
        </div>
        <div class="grid-box">
          <p>Online Drivers</p>
          <h2 id="onlineDrivers" class="status-active">0</h2>
        </div>
      </div>

      <div class="body"></div>
    </div>
  </body>
</html>

<script src="../config.obf.js"></script>
<script src="../animate.obf.js"></script>
<script src="dashboard.obf.js"></script>
<script src="socket.obf.js"></script>
<script src="../call.obf.js"></script>
